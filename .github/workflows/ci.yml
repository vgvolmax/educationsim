name: EducationSim checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_windows_zip:
        description: Upload the Windows ZIP after desktop verification.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run check
      - run: npm run catalog:validate -- content/catalog/public-v1.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run package:win
      - name: Verify the extracted Windows ZIP
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem out/make -Recurse -File -Filter '*.zip')
          if ($zip.Count -ne 1) { throw "Expected exactly one Windows ZIP; got $($zip.Count)" }
          $target = Join-Path $env:RUNNER_TEMP 'EducationSim — тест запуска'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $target
          $exe = @(Get-ChildItem -LiteralPath $target -Recurse -File -Filter 'EducationSim.exe')
          if ($exe.Count -ne 1) { throw "Expected exactly one EducationSim.exe; got $($exe.Count)" }
          $env:EDUCATIONSIM_DESKTOP_EXE = $exe[0].FullName
          npm run test:desktop
      - name: Stage verified Windows ZIP
        if: ${{ inputs.upload_windows_zip }}
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem out/make -Recurse -File -Filter '*.zip')
          if ($zip.Count -ne 1) { throw "Expected exactly one Windows ZIP; got $($zip.Count)" }
          $directory = New-Item -ItemType Directory -Path release-files
          $file = Copy-Item -LiteralPath $zip[0].FullName -Destination (Join-Path $directory.FullName 'EducationSim-Windows-x64.zip') -PassThru
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -LiteralPath (Join-Path $directory.FullName 'SHA256SUMS.txt') -Encoding ascii
      - name: Upload verified Windows ZIP
        if: ${{ inputs.upload_windows_zip }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: EducationSim-Windows-x64
          path: |
            release-files/EducationSim-Windows-x64.zip
            release-files/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14
