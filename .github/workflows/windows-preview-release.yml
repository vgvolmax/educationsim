name: EducationSim Windows preview release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-preview-release.yml

permissions:
  contents: read

jobs:
  verify-and-build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      upload_windows_zip: true

  release-draft:
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified Windows ZIP
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: EducationSim-Windows-x64
          path: release-files
      - name: Verify checksum and prepare preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-files
          sha256sum --strict --check SHA256SUMS.txt
          tag="preview-windows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > notes.md <<EOF
          Тестовая сборка EducationSim для Windows 11 x64.

          Распакуйте EducationSim-Windows-x64.zip целиком и запустите EducationSim.exe.
          Контрольная сумма архива находится в SHA256SUMS.txt.

          Это кандидат учебного выпуска, не версия 1.0. Каталог справочный, без рекомендаций к покупке.
          Проверка интерфейса: новый проект → установить котёл и коллектор → соединить подачу,
          обратку и петлю; открыть штатный урок, выполнить один шаг и убедиться, что линии видны.
          Проверки на рабочем Windows-компьютере и пилот в компании проводятся отдельно.

          Коммит: ${GITHUB_SHA}
          Проверки и сборка: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$tag" EducationSim-Windows-x64.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EducationSim Windows x64 · тестовая сборка #${GITHUB_RUN_NUMBER}" \
            --notes-file notes.md \
            --draft --prerelease --latest=false
